name: prestaya

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - prestaya_net

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    container_name: prestaya-postgres
    environment:
      POSTGRES_USER: ${DB_USER:?Falta DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      POSTGRES_DB: ${DB_NAME:?Falta DB_NAME en .env}
      # scram-sha-256: hash de contraseñas moderno. data-checksums: detecta corrupción en disco.
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --data-checksums'
      TZ: UTC
      PGTZ: UTC
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    <<: *hardening
    image: redis:7-alpine
    container_name: prestaya-redis
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}
    # noeviction: BullMQ exige que Redis nunca descarte jobs por falta de memoria.
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      # REDISCLI_AUTH evita exponer la contraseña como argumento de proceso.
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # La imagen de Chainguard corre como usuario sin privilegios (65532):
  # este contenedor de un solo uso le asigna la propiedad del volumen.
  # No hereda x-hardening porque necesita ejecutar chown como root.
  minio-permissions:
    image: busybox:1.37
    container_name: prestaya-minio-permissions
    command: ['chown', '-R', '65532:65532', '/data']
    volumes:
      - minio_data:/data
    network_mode: none
    restart: 'no'

  minio:
    <<: *hardening
    # Imagen distroless sin shell: no soporta healthcheck interno.
    # minio-init valida la conectividad mediante restart: on-failure.
    image: cgr.dev/chainguard/minio:latest
    container_name: prestaya-minio
    user: '65532:65532'
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Falta S3_ACCESS_KEY en .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Falta S3_SECRET_KEY en .env}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    depends_on:
      minio-permissions:
        condition: service_completed_successfully

  # Crea el bucket privado. Se reintenta (on-failure:10) hasta que MinIO acepte conexiones.
  # Los buckets nuevos de MinIO son privados por defecto: sin acceso anónimo.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: prestaya-minio-init
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY:?Falta S3_ACCESS_KEY en .env}:${S3_SECRET_KEY:?Falta S3_SECRET_KEY en .env}@minio:9000
    command: ['mb', '--ignore-existing', 'local/${S3_BUCKET_PRIVATE:-prestaya-private-docs}']
    depends_on:
      minio:
        condition: service_started
    restart: on-failure:10
    security_opt:
      - no-new-privileges:true
    networks:
      - prestaya_net

  mailpit:
    <<: *hardening
    image: axllent/mailpit:v1.34.0
    container_name: prestaya-mailpit
    environment:
      MP_MAX_MESSAGES: 500
      TZ: America/Bogota
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  prestaya_net:
    driver: bridge
